<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Prompt API save previous session</title>

    <link href="index.css" rel="stylesheet" />
    <script defer src="index.js"></script>
  </head>
  <body>
    <h1>Prompt API demo</h1>
    <p>
      This demo stores your previous session prompt history using the Web
      Storage API, and provides an option to delete it. First released in Chrome
      148 (see
      <a
        href="https://developer.mozilla.org/docs/Web/API/Prompt_API#browser_compatibility"
        >full browser compat data</a
      >).
    </p>

    <h2>Input</h2>

    <form>
      <div>
        <label for="prompt-text">Enter prompt text:</label>
        <textarea id="prompt-text" name="promptText" rows="6"></textarea>
      </div>
      <button type="submit" id="submit">Submit query</button
      ><button type="button" id="abort">Abort query</button>
      <button type="button" id="delete-session">
        Delete saved prompt history
      </button>
    </form>

    <h2>Output</h2>

    <p class="prompt-output"></p>
  </body>
</html>
